<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AI Quotabar app icon: three quota bars on a dark tile, drawn on Apple's 1024 icon grid. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3040"/>
      <stop offset="1" stop-color="#11141B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8703F"/>
      <stop offset="1" stop-color="#F7A97F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F7BEA"/>
      <stop offset="1" stop-color="#93B4FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22B36B"/>
      <stop offset="1" stop-color="#74E8A6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- tracks -->
  <rect x="232" y="292" width="560" height="104" rx="52" fill="#FFFFFF" fill-opacity="0.10"/>
  <rect x="232" y="460" width="560" height="104" rx="52" fill="#FFFFFF" fill-opacity="0.10"/>
  <rect x="232" y="628" width="560" height="104" rx="52" fill="#FFFFFF" fill-opacity="0.10"/>

  <!-- fills -->
  <rect x="232" y="292" width="440" height="104" rx="52" fill="url(#orange)"/>
  <rect x="232" y="460" width="236" height="104" rx="52" fill="url(#blue)"/>
  <rect x="232" y="628" width="336" height="104" rx="52" fill="url(#green)"/>
</svg>
